server:
  port: 8081

spring:

  config:
    import: optional:file:./common/application-common.yml

  application:
    name: PRODUCT-SERVICE

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${database.host}:${database.port}/product_catalog_db
    username: ${database.username}
    password: ${database.password}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true



