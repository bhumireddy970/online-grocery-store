server:
  port: 8083


spring:


  config:
    import: optional:file:./common/application-common.yml

  application:
    name: ORDER-SERVICE

  cloud:

    openfeign:

      client:

        config:

          default:

            connectTimeout: 3000

            readTimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${database.host}:${database.port}/order_db
    username: ${database.username}
    password: ${database.password}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true


eureka:
  client:
    service-url:
#      defaultZone: http://service-registry:8761/eureka
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /api-docs

resilience4j:

  circuitbreaker:

    instances:

      productService:

        sliding-window-size: 10

        minimum-number-of-calls: 5

        failure-rate-threshold: 50

        wait-duration-in-open-state: 30s

      inventoryService:

        sliding-window-size: 10

        minimum-number-of-calls: 5

        failure-rate-threshold: 50

        wait-duration-in-open-state: 30s