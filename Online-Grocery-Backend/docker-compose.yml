services:

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./common/application-common.yml:/config/application-common.yml
    environment:
        SPRING_CONFIG_IMPORT: optional:file:/config/application-common.yml

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    depends_on:
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./common/application-common.yml:/config/application-common.yml
    environment:
        SPRING_CONFIG_IMPORT: optional:file:/config/application-common.yml

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    depends_on:
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./common/application-common.yml:/config/application-common.yml
    environment:
        SPRING_CONFIG_IMPORT: optional:file:/config/application-common.yml

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./common/application-common.yml:/config/application-common.yml
    environment:
        SPRING_CONFIG_IMPORT: optional:file:/config/application-common.yml
  mysql:
    image: mysql:8.0

    container_name: grocery-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: abcd1234

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pabcd1234" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
    mysql-data:


